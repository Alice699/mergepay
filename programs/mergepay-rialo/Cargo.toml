[package]
name = "mergepay-rialo"
version = "0.1.0"
edition = "2021"
description = "Trust-minimized GitHub pull-request bounty escrow on Rialo"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["implementation"]
implementation = []
custom-heap = []
custom-panic = []

[dependencies]
rialo-venus = "0.18.1"
rialo-venus-proc-macro = "0.18.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
