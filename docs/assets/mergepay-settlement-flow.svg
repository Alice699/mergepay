<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="768" viewBox="0 0 1200 768" role="img" aria-labelledby="title description">
  <title id="title">MergePay bounty lifecycle</title>
  <desc id="description">A sponsor creates a bounty with a locked PR revision and policy. The contributor requests a claim, the sponsor approves the receiving wallet, and the sponsor funds escrow. Rialo's native workflow checks the deadline and requests GitHub proof through REX. A valid policy-passing callback before the deadline pays the contributor. A funded workflow that reaches its deadline without payout refunds the sponsor. Unmet or inconclusive proof does not authorize payout and is retried while active. GitHub identity verification is an application check; the program enforces escrow rules.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#798694" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .heading { fill: #e6edf3; font-weight: 600; }
      .body { fill: #aab6c2; font-size: 18px; }
      .label { fill: #96a4b2; font-size: 15px; letter-spacing: 0.7px; }
      .connector { fill: none; stroke: #798694; stroke-width: 1.5; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="766" rx="12" fill="#0d1117" stroke="#30363d" />
  <text x="48" y="49" class="heading" font-size="30">Bounty lifecycle</text>
  <text x="1152" y="47" text-anchor="end" class="label">MERGEPAY / RIALO DEVNET</text>
  <text x="48" y="81" class="body">Terms and recipient are fixed before escrow funding.</text>
  <path d="M48 103H1152" stroke="#30363d" />

  <g data-step="create">
    <rect x="48" y="130" width="252" height="140" rx="8" fill="#151b23" stroke="#37414d" />
    <text x="68" y="158" class="label">01 / SPONSOR</text>
    <text x="68" y="192" class="heading" font-size="22">Create bounty</text>
    <text x="68" y="225" class="body">PR, revision, policy</text>
    <text x="68" y="249" class="body">Amount and deadline</text>
  </g>

  <path d="M301 200H329" class="connector" />

  <g data-step="claim">
    <rect x="332" y="130" width="252" height="140" rx="8" fill="#151b23" stroke="#37414d" />
    <text x="352" y="158" class="label">02 / CONTRIBUTOR</text>
    <text x="352" y="192" class="heading" font-size="22">Request claim</text>
    <text x="352" y="225" class="body">GitHub author ID</text>
    <text x="352" y="249" class="body">Receiving wallet</text>
  </g>

  <path d="M585 200H613" class="connector" />

  <g data-step="approve">
    <rect x="616" y="130" width="252" height="140" rx="8" fill="#151b23" stroke="#37414d" />
    <text x="636" y="158" class="label">03 / SPONSOR</text>
    <text x="636" y="192" class="heading" font-size="22">Approve claim</text>
    <text x="636" y="225" class="body">Review claim and terms</text>
    <text x="636" y="249" class="body">Lock beneficiary</text>
  </g>

  <path d="M869 200H897" class="connector" />

  <g data-step="fund">
    <rect x="900" y="130" width="252" height="140" rx="8" fill="#151b23" stroke="#37414d" />
    <text x="920" y="158" class="label">04 / SPONSOR</text>
    <text x="920" y="192" class="heading" font-size="22">Fund escrow</text>
    <text x="920" y="225" class="body">Prepare + fund</text>
    <text x="920" y="249" class="body">Arm native timers</text>
  </g>

  <path d="M1026 271V304H600V331" class="connector" />

  <g data-step="verify">
    <rect x="324" y="334" width="552" height="142" rx="8" fill="#151b23" stroke="#536272" />
    <text x="348" y="363" class="label">05 / RIALO NATIVE WORKFLOW</text>
    <text x="348" y="398" class="heading" font-size="24">Check deadline and REX proof</text>
    <text x="348" y="430" class="body">Match PR revision, branch, and selected CI/reviews.</text>
    <text x="348" y="456" fill="#96a4b2" font-size="17">Unmet or inconclusive proof: retry before expiry.</text>
  </g>

  <path d="M600 477V508H308V545" class="connector" />
  <path d="M600 508H892V545" class="connector" />

  <g data-outcome="paid">
    <rect x="48" y="548" width="520" height="144" rx="8" fill="#101b17" stroke="#477563" />
    <text x="72" y="578" fill="#8ad5b4" font-size="16" font-weight="600" letter-spacing="0.7">PAID</text>
    <text x="72" y="616" class="heading" font-size="24">Reward sent to contributor</text>
    <text x="72" y="649" class="body">Policy passes and the valid callback executes</text>
    <text x="72" y="675" class="body">before the deadline.</text>
  </g>

  <g data-outcome="refunded">
    <rect x="632" y="548" width="520" height="144" rx="8" fill="#151b23" stroke="#536272" />
    <text x="656" y="578" fill="#bdc9d5" font-size="16" font-weight="600" letter-spacing="0.7">REFUNDED</text>
    <text x="656" y="616" class="heading" font-size="24">Reward returned to sponsor</text>
    <text x="656" y="649" class="body">Funded workflow reaches the deadline</text>
    <text x="656" y="675" class="body">without a completed payout.</text>
  </g>

  <text x="48" y="735" fill="#96a4b2" font-size="16">GitHub identity is checked by the web app; escrow rules are enforced by the program.</text>
</svg>
