<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">MergePay autonomous settlement flow</title>
  <desc id="description">A sponsor publishes a bounty, a contributor verifies and claims it, the sponsor approves and funds escrow, Rialo REX verifies GitHub, then MergePay automatically pays the contributor or refunds the sponsor at the deadline.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B100F" />
      <stop offset="0.58" stop-color="#0A100F" />
      <stop offset="1" stop-color="#101B1A" />
    </linearGradient>
    <linearGradient id="seafoamGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9DDD3" stop-opacity="0.18" />
      <stop offset="1" stop-color="#A9DDD3" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="successGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58D68D" stop-opacity="0.16" />
      <stop offset="1" stop-color="#58D68D" stop-opacity="0.02" />
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#DDE9E5" stroke-opacity="0.035" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#62807A" />
    </marker>
    <marker id="arrowSuccess" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#58D68D" />
    </marker>
    <style>
      .eyebrow { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2.4px; }
      .title { font: 700 38px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: -1px; }
      .subtitle { font: 400 18px Inter, "Segoe UI", Arial, sans-serif; }
      .step { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.6px; }
      .cardTitle { font: 700 22px Inter, "Segoe UI", Arial, sans-serif; }
      .cardBody { font: 400 15px Inter, "Segoe UI", Arial, sans-serif; }
      .result { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.35px; }
      .micro { font: 600 13px Inter, "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="1598" height="758" rx="30" fill="url(#background)" stroke="#2B3C38" stroke-width="2" />
  <rect x="1" y="1" width="1598" height="758" rx="30" fill="url(#grid)" />
  <circle cx="1430" cy="48" r="230" fill="#16302C" opacity="0.18" />
  <circle cx="1570" cy="708" r="300" fill="#19352F" opacity="0.12" />

  <g transform="translate(72 58)">
    <rect width="52" height="52" rx="16" fill="#E8ECEA" />
    <path d="M16 16h20c4 0 6.5 2.9 6 7l-.8 6.5c-.5 4-3.2 6.2-7.3 6.2H18.1c-4.1 0-6.8-2.2-7.3-6.2L10 23c-.5-4.1 2-7 6-7Z" fill="#2B4559" />
    <path d="M18.5 25h3.5M30 25h3.5" fill="none" stroke="#A9DDD3" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <text x="144" y="77" class="eyebrow" fill="#A9DDD3">RIALO-NATIVE WORKFLOW</text>
  <text x="144" y="112" class="title" fill="#F1F5F3">One workflow. Two terminal outcomes.</text>
  <text x="72" y="151" class="subtitle" fill="#94A19D">MergePay keeps identity, escrow, external proof, and settlement in one auditable lifecycle.</text>

  <g transform="translate(1246 62)">
    <rect width="282" height="40" rx="20" fill="#111A18" stroke="#334944" />
    <circle cx="22" cy="20" r="4" fill="#58D68D" />
    <text x="38" y="25" class="step" fill="#C9D4D0">RIALO DEVNET · LIVE PROOF</text>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(72 200)">
      <rect width="250" height="176" rx="20" fill="#111816" stroke="#2A3B37" />
      <rect width="250" height="176" rx="20" fill="url(#seafoamGlow)" />
      <circle cx="35" cy="35" r="17" fill="#162522" stroke="#496C65" />
      <text x="35" y="40" text-anchor="middle" class="step" fill="#A9DDD3">01</text>
      <text x="24" y="82" class="cardTitle" fill="#F0F4F2">Publish</text>
      <text x="24" y="112" class="cardBody" fill="#98A49F">Sponsor commits repo, PR,</text>
      <text x="24" y="136" class="cardBody" fill="#98A49F">reward, and deadline.</text>
      <text x="24" y="160" class="step" fill="#65736F">WORKFLOW PDA</text>
    </g>

    <g transform="translate(374 200)">
      <rect width="250" height="176" rx="20" fill="#111816" stroke="#2A3B37" />
      <circle cx="35" cy="35" r="17" fill="#162522" stroke="#496C65" />
      <text x="35" y="40" text-anchor="middle" class="step" fill="#A9DDD3">02</text>
      <text x="24" y="82" class="cardTitle" fill="#F0F4F2">Verify &amp; claim</text>
      <text x="24" y="112" class="cardBody" fill="#98A49F">OAuth binds PR author</text>
      <text x="24" y="136" class="cardBody" fill="#98A49F">to a payout wallet.</text>
      <text x="24" y="160" class="step" fill="#65736F">CLAIM PDA</text>
    </g>

    <g transform="translate(676 200)">
      <rect width="250" height="176" rx="20" fill="#111816" stroke="#2A3B37" />
      <circle cx="35" cy="35" r="17" fill="#162522" stroke="#496C65" />
      <text x="35" y="40" text-anchor="middle" class="step" fill="#A9DDD3">03</text>
      <text x="24" y="82" class="cardTitle" fill="#F0F4F2">Approve</text>
      <text x="24" y="112" class="cardBody" fill="#98A49F">Sponsor checks identity,</text>
      <text x="24" y="136" class="cardBody" fill="#98A49F">wallet, and exact terms.</text>
      <text x="24" y="160" class="step" fill="#65736F">BENEFICIARY LOCKED</text>
    </g>

    <g transform="translate(978 200)">
      <rect width="250" height="176" rx="20" fill="#111816" stroke="#2A3B37" />
      <circle cx="35" cy="35" r="17" fill="#162522" stroke="#496C65" />
      <text x="35" y="40" text-anchor="middle" class="step" fill="#A9DDD3">04</text>
      <text x="24" y="82" class="cardTitle" fill="#F0F4F2">Fund escrow</text>
      <text x="24" y="112" class="cardBody" fill="#98A49F">Exact RLO is locked and</text>
      <text x="24" y="136" class="cardBody" fill="#98A49F">native heartbeat is armed.</text>
      <text x="24" y="160" class="step" fill="#65736F">AFTER TIMER</text>
    </g>

    <g transform="translate(1280 200)">
      <rect width="248" height="176" rx="20" fill="#14211E" stroke="#50766E" />
      <rect width="248" height="176" rx="20" fill="url(#seafoamGlow)" />
      <circle cx="35" cy="35" r="17" fill="#1B302C" stroke="#659A90" />
      <text x="35" y="40" text-anchor="middle" class="step" fill="#D4F0EA">05</text>
      <text x="24" y="82" class="cardTitle" fill="#F0F4F2">REX verifies</text>
      <text x="24" y="112" class="cardBody" fill="#AFC0BA">Validators query GitHub's</text>
      <text x="24" y="136" class="cardBody" fill="#AFC0BA">compact merge endpoint.</text>
      <text x="24" y="160" class="step" fill="#83B4AA">PUBLIC SIGNAL</text>
    </g>
  </g>

  <g fill="none" stroke="#62807A" stroke-width="2" marker-end="url(#arrow)">
    <path d="M330 288H362" />
    <path d="M632 288H664" />
    <path d="M934 288H966" />
    <path d="M1236 288H1268" />
  </g>

  <path d="M1404 388V420H298V454M1404 420H800V454M1404 420V454" fill="none" stroke="#405853" stroke-width="2" />
  <circle cx="1404" cy="420" r="5" fill="#A9DDD3" />
  <path d="M298 444V454" stroke="#58D68D" stroke-width="2" marker-end="url(#arrowSuccess)" />
  <path d="M800 444V454" stroke="#62807A" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M1404 444V454" stroke="#A9DDD3" stroke-width="2" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <g transform="translate(72 468)">
      <rect width="452" height="174" rx="20" fill="#101A17" stroke="#2F6748" />
      <rect width="452" height="174" rx="20" fill="url(#successGlow)" />
      <circle cx="34" cy="34" r="13" fill="#153322" stroke="#58D68D" />
      <path d="m28 34 4 4 8-9" fill="none" stroke="#72E5A2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="58" y="39" class="step" fill="#72E5A2">UNANIMOUS HTTP 204</text>
      <text x="24" y="85" class="cardTitle" fill="#F0F4F2">Merged proof confirmed</text>
      <text x="24" y="115" class="cardBody" fill="#9EAEA8">Reactive callback releases the exact escrow.</text>
      <rect x="24" y="132" width="204" height="28" rx="14" fill="#173C27" stroke="#347A4D" />
      <text x="126" y="151" text-anchor="middle" class="result" fill="#72E5A2">PAY CONTRIBUTOR</text>
    </g>

    <g transform="translate(574 468)">
      <rect width="452" height="174" rx="20" fill="#111816" stroke="#394642" />
      <circle cx="34" cy="34" r="13" fill="#202925" stroke="#73807B" />
      <path d="M29 34h10" fill="none" stroke="#A7B0AC" stroke-width="2.5" stroke-linecap="round" />
      <text x="58" y="39" class="step" fill="#AAB4B0">404 · ERROR · DISAGREEMENT</text>
      <text x="24" y="85" class="cardTitle" fill="#F0F4F2">No valid merge proof</text>
      <text x="24" y="115" class="cardBody" fill="#9EAEA8">Fail closed; keep funds locked and retry.</text>
      <rect x="24" y="132" width="238" height="28" rx="14" fill="#1A211F" stroke="#46544F" />
      <text x="143" y="151" text-anchor="middle" class="result" fill="#B8C0BD">ESCROW STAYS LOCKED</text>
    </g>

    <g transform="translate(1076 468)">
      <rect width="452" height="174" rx="20" fill="#111A18" stroke="#4B6D66" />
      <rect width="452" height="174" rx="20" fill="url(#seafoamGlow)" />
      <circle cx="34" cy="34" r="13" fill="#1A2C28" stroke="#A9DDD3" />
      <path d="M34 26v9l6 4M34 21v2" fill="none" stroke="#C6EBE4" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="58" y="39" class="step" fill="#C6EBE4">DEADLINE REACHED FIRST</text>
      <text x="24" y="85" class="cardTitle" fill="#F0F4F2">Automatic expiry refund</text>
      <text x="24" y="115" class="cardBody" fill="#A8B8B2">Native heartbeat returns the exact escrow.</text>
      <rect x="24" y="132" width="192" height="28" rx="14" fill="#19302B" stroke="#4C776E" />
      <text x="120" y="151" text-anchor="middle" class="result" fill="#C6EBE4">REFUND SPONSOR</text>
    </g>
  </g>

  <g transform="translate(72 697)">
    <circle cx="5" cy="5" r="5" fill="#58D68D" />
    <text x="22" y="10" class="micro" fill="#97A49F">No keeper</text>
    <circle cx="132" cy="5" r="5" fill="#58D68D" />
    <text x="149" y="10" class="micro" fill="#97A49F">No webhook payout backend</text>
    <circle cx="373" cy="5" r="5" fill="#58D68D" />
    <text x="390" y="10" class="micro" fill="#97A49F">No trusted payout signer</text>
  </g>
  <text x="1528" y="707" text-anchor="end" class="eyebrow" fill="#5F716C">MERGEPAY · DEVNET</text>
</svg>
